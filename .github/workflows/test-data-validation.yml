name: Data validation tests

on:
  push:
    branches:
      - audit/data-validation
  pull_request:
    branches:
      - main

jobs:
  test-data-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install "pandas>=2.0,<3.0" "openpyxl>=3.1,<4.0" "Flask>=3.0,<4.0"
      - name: Run validation tests
        run: python -m unittest test_data_validation.py test_excel_import.py test_app_headers.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install JavaScript test dependency
        run: npm install
      - name: Test filters and sorting behavior
        run: npm run test:filters
